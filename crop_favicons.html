<!DOCTYPE html>
<html>

<body>
    <img id="source" src="source_image.jpg" style="display:none">
    <canvas id="canvas" width="250" height="250" style="display:none"></canvas>
    <div id="status">Loading...</div>
    <div id="results"></div>

    <script>
        const img = document.getElementById('source');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const status = document.getElementById('status');
        const results = document.getElementById('results');

        img.onload = () => {
            const crops = [
                { name: 'elegant', x: 55, y: 133, w: 248, h: 248 },
                { name: 'classic', x: 381, y: 133, w: 248, h: 248 },
                { name: 'sophisticated', x: 708, y: 133, w: 248, h: 248 }
            ];

            crops.forEach(crop => {
                ctx.clearRect(0, 0, 250, 250);
                // Draw a bit larger to ensure we cover the card, then the favicon process will handle resizing
                ctx.drawImage(img, crop.x, crop.y, crop.w, crop.h, 0, 0, 250, 250);
                const dataUrl = canvas.toDataURL('image/png');
                const div = document.createElement('div');
                div.id = 'res-' + crop.name;
                div.textContent = dataUrl;
                results.appendChild(div);
            });
            status.textContent = 'DONE';
        };
    </script>
</body>

</html>
